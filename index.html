<!-- FINAL CONNECTED VERSION: routed A:E submission and direct Google Sheets submission -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egyptian American Center - Placement Test</title>
    <link rel="icon" href="assets/images/eacc-logo.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="assets/css/styles.css?v=fcea41e">
</head>
<body>

    <div class="container" id="printable-area">
        <div id="camera-view">
            <h2>Capture Your Photo</h2>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <br>
            <button type="button" id="take-photo-button" class="btn">Take Photo & Continue</button>
            <button type="button" id="continue-without-photo-button" class="btn btn-secondary">Continue Without Photo</button>
            <p class="camera-note">Camera access requires HTTPS or localhost. The photo is optional and is used only in the optional PDF; it is not sent to Google Sheets.</p>
        </div>

        <div id="form-view">
            <div class="header-section">
                <div class="logo-section">
                    <img src="assets/images/eacc-logo.jpg" alt="" width="200" height="123" />
                </div>
                <div class="form-info">
                    <h2>Placement Test Card</h2>
                </div>
                <div class="photo-section">
                    <img id="captured-photo" alt="">
                </div>
            </div>

            <form id="data-form" method="post" target="_blank">
<input type="hidden" id="submissionId" name="submissionId">
<input type="hidden" id="programmeFallback" name="programmeFallback">
<input type="hidden" id="languageFallback" name="languageFallback">
<input type="hidden" id="campFallback" name="campFallback">
<div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required autocomplete="name" placeholder="Enter your full name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="mobileNumber">Mobile Number:</label>
                        <input type="tel" id="mobileNumber" name="mobileNumber" required autocomplete="tel" inputmode="tel"
                               maxlength="25" pattern="(?:[0-9]|\+|\(|\)|\.|-| ){8,25}" placeholder="Example: +20 10 1234 5678">
                    </div>
                    <div class="form-group">
                        <label for="testDate">Test Date:</label>
                        <input type="text" id="testDate" name="testDate" required inputmode="numeric"
                               placeholder="DD/MM/YYYY" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
                    </div>
                </div>
                <p class="required-note">Fields marked by the browser as required must be completed before submission.</p>
                <div class="form-group">
                    <label for="programme">Programme:</label>
                    <select id="programme" name="programme" required>
                        <option value="">-- Select Programme --</option>
                        <option value="Kids">Kids</option>
                        <option value="Youth">Youth</option>
                        <option value="Adults">Adults</option>
                        <option value="Private">Private</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="language">Language:</label>
                    <select id="language" name="language" required>
                        <option value="">-- Select Language --</option>
                        <option value="General English">General English</option>
                        <option value="Conversation">Conversation</option>
                        <option value="TOEFL">TOEFL</option>
                        <option value="IELTS">IELTS</option>
                        <option value="PTE">PTE</option>
                        <option value="OET">OET</option>
                        <option value="Italian">Italian</option>
                        <option value="German">German</option>
                        <option value="French">French</option>
                        <option value="Spanish">Spanish</option>
                    </select>
                </div>
                <div id="camp-group" class="form-group conditional-field">
                    <label for="camp">Camp:</label>
                    <select id="camp" name="camp">
                        <option value="">-- Select Camp --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="level">Candidate Level:</label>
                    <div id="level-control">
                        <select id="level" name="level" required>
                            <option value="">-- Select Level --</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Elementary">Elementary</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Upper Intermediate">Upper Intermediate</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Advanced Plus">Advanced Plus</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Course Time:</label>
                    <div class="time-range-container">
                        <div class="time-input-wrapper">
                            <label for="courseTimeFrom">From</label>
                            <input type="time" id="courseTimeFrom" name="courseTimeFrom">
                        </div>
                        <div class="time-input-wrapper">
                            <label for="courseTimeTo">To</label>
                            <input type="time" id="courseTimeTo" name="courseTimeTo">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="startingDate">Starting Date:</label>
                    <input type="text" id="startingDate" name="startingDate" inputmode="numeric"
                           placeholder="DD/MM/YYYY" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="courseCamp">Camp:</label>
                        <input type="text" id="courseCamp" name="courseCamp" placeholder="Enter camp name">
                    </div>
                    <div class="form-group">
                        <label for="session">Session:</label>
                        <input type="text" id="session" name="session" placeholder="Enter session">
                    </div>
                </div>
                <div class="form-group">
                    <label>Course Days:</label>
                    <div class="days-container">
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDaySaturday" name="courseDays" value="Saturday">
                            <label for="courseDaySaturday">Saturday</label>
                        </div>
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDaySunday" name="courseDays" value="Sunday">
                            <label for="courseDaySunday">Sunday</label>
                        </div>
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDayMonday" name="courseDays" value="Monday">
                            <label for="courseDayMonday">Monday</label>
                        </div>
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDayTuesday" name="courseDays" value="Tuesday">
                            <label for="courseDayTuesday">Tuesday</label>
                        </div>
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDayWednesday" name="courseDays" value="Wednesday">
                            <label for="courseDayWednesday">Wednesday</label>
                        </div>
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDayThursday" name="courseDays" value="Thursday">
                            <label for="courseDayThursday">Thursday</label>
                        </div>
                        <div class="day-checkbox">
                            <input type="checkbox" id="courseDayFriday" name="courseDays" value="Friday">
                            <label for="courseDayFriday">Friday</label>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Notes:</label>
                    <textarea id="notes" name="notes" maxlength="3000"
                              placeholder="Enter any notes about the candidate or placement test"></textarea>
                </div>
                <div class="done-by-section">
                    <label for="doneBy">Done by:</label>
                    <input type="text" id="doneBy" name="doneBy" maxlength="80" placeholder="Type staff name">
                </div>
            </form>

            <div class="actions" data-html2canvas-ignore="true">
                <button type="submit" form="data-form" id="submit-button" class="btn btn-success">Submit to Google Sheet</button>
                <button type="button" id="download-pdf-button" class="btn">Download PDF (Optional)</button>
                <button type="button" id="reset-form-button" class="btn btn-secondary">Retake Photo</button>
            </div>
            <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
        </div>
    </div>

    <script src="assets/js/config.js?v=fcea41e" defer></script>
    <script src="assets/js/app.js?v=fcea41e" defer></script>
</body>
</html>
